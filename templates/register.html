{% extends "base.html" %}
{% block title %}Sign Up - Chess{% endblock %}
{% block content %}
<div class="min-h-[80vh] flex items-center justify-center">
    <div class="card rounded-2xl p-8 w-full max-w-md shadow-2xl">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold">Create Account</h2>
            <p class="text-gray-400 mt-2">Join thousands of chess players</p>
        </div>
        <form method="POST" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Username</label>
                <input type="text" name="username" required minlength="3" maxlength="20"
                       class="w-full px-4 py-3 rounded-lg bg-[#0a0e27] border border-gray-700 text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition"
                       placeholder="Choose a username">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Email</label>
                <input type="email" name="email" required
                       class="w-full px-4 py-3 rounded-lg bg-[#0a0e27] border border-gray-700 text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition"
                       placeholder="your@email.com">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Password</label>
                <input type="password" name="password" required minlength="6"
                       class="w-full px-4 py-3 rounded-lg bg-[#0a0e27] border border-gray-700 text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition"
                       placeholder="At least 6 characters">
            </div>
            <button type="submit" class="w-full btn-primary py-3 rounded-lg text-white font-semibold text-lg">
                Create Account
            </button>
        </form>
        <p class="mt-6 text-center text-gray-400 text-sm">
            Already have an account? <a href="{{ url_for('login') }}" class="text-indigo-400 hover:text-indigo-300">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}
